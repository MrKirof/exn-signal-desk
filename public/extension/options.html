<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Desk collector</title>
    <style>
      body { font: 13px/1.45 ui-sans-serif, system-ui, sans-serif; background: #14170f; color: #ece7dc; margin: 0; padding: 14px; width: 340px; }
      h1 { font-size: 15px; margin: 0 0 6px; font-weight: 560; }
      label { display: block; margin: 8px 0; color: #8c8678; font-size: 12px; }
      input { width: 100%; box-sizing: border-box; margin-top: 4px; height: 32px; border: 1px solid #2a2e38; background: #0c0e14; color: #ece7dc; border-radius: 6px; padding: 0 8px; }
      button { height: 34px; width: 100%; border: 0; background: #e0b15a; color: #1a1408; border-radius: 6px; font-weight: 650; cursor: pointer; margin-top: 8px; }
      p { font-size: 12px; color: #8c8678; margin: 8px 0; }
      .ok { color: #8fbf73; }
      .bad { color: #e07a62; }
      .live { margin-top: 12px; padding-top: 10px; border-top: 1px solid #2a2e38; }
    </style>
  </head>
  <body>
    <h1>Desk collector</h1>
    <p>Reads the Exness chart and sends it to the desktop app on this PC. It does not place an order. The address must be http://127.0.0.1 and the port of the app. Paste the token shown in the app.</p>
    <label>Local desk<input id="url" type="url" placeholder="http://127.0.0.1:8090" autocomplete="off" /></label>
    <label>Token<input id="token" type="password" placeholder="token from the desk" autocomplete="off" /></label>
    <button id="save">Save</button>
    <button id="test">Test link</button>
    <p id="status"></p>
    <div class="live">
      <p id="live">No quote yet. Open the Exness chart.</p>
    </div>
    <script type="module" src="options.js"></script>
  </body>
</html>
